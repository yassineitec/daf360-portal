spring:
  application:
    name: daf360-portal

  datasource:
    url: jdbc:sqlserver://${DB_HOST:localhost}:${DB_PORT:1433};databaseName=DAF360_HR;encrypt=true;trustServerCertificate=true
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver

  jpa:
    hibernate:
      ddl-auto: validate
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.SQLServerDialect
        format_sql: false

  security:
    oauth2:
      client:
        registration:
          azure:
            client-id: ${AZURE_CLIENT_ID}
            client-secret: ${AZURE_CLIENT_SECRET}
            scope: [openid, profile, email, offline_access]
            redirect-uri: "{baseUrl}/login/oauth2/code/azure"
            authorization-grant-type: authorization_code
        provider:
          azure:
            issuer-uri: "https://login.microsoftonline.com/${AZURE_TENANT_ID}/v2.0"

server:
  port: ${PORT:8080}
  forward-headers-strategy: NATIVE
  servlet:
    session:
      cookie:
        same-site: strict
        secure: true
        http-only: true

app:
  # Shared HMAC secret — must match app.jwt-secret in rh-service exactly.
  # Hardcoded here to prevent env-var differences between terminal sessions.
  jwt-secret: daf360-change-me-in-production-32chars
  jwt:
    private-key-path: ${JWT_PRIVATE_KEY_PATH}
    public-key-path: ${JWT_PUBLIC_KEY_PATH}
    access-token-expiry-seconds: ${JWT_ACCESS_EXPIRY:3600}
    refresh-token-expiry-seconds: ${JWT_REFRESH_EXPIRY:604800}
    issuer: daf360-portal
  frontend-url: ${FRONTEND_URL:http://localhost:4200}
  cors:
    portal-origin: ${PORTAL_ORIGIN:http://localhost:4200}
    hr-origin: ${HR_ORIGIN:http://localhost:4201}
    facturation-origin: ${FACTURATION_ORIGIN:http://localhost:4202}
    timesheet-origin: ${TIMESHEET_ORIGIN:http://localhost:4203}
  cookie:
    secure: ${COOKIE_SECURE:false}
    same-site: Strict
    domain: ${COOKIE_DOMAIN:}
  default-pays-id: ${DEFAULT_PAYS_ID:1}
  rh-db:
    url: ${RH_DB_URL:jdbc:sqlserver://localhost:1433;databaseName=DAF360-HR;encrypt=false;trustServerCertificate=true}
    username: ${RH_DB_USERNAME:sa}
    password: ${RH_DB_PASSWORD:}
